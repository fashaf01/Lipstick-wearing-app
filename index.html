<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Try-On Clothes</title>
    <meta name="description" content="Try on tops, bottoms and dresses live with your camera." />
    <meta name="theme-color" content="#0c1015" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Try-On Clothes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <div class="stage">
        <canvas id="view" aria-label="Live clothes try-on preview"></canvas>
        <canvas id="joints-overlay" hidden></canvas>
        <video id="cam" playsinline muted autoplay></video>
        <div id="status" class="pill" role="status" hidden></div>
      </div>

      <header class="topbar">
        <div class="brand">Try-On <span>Clothes</span></div>
        <button id="btn-flip" class="icon-btn" aria-label="Switch camera">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l1.5-2h9L18 7h3v12H3z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14.5 9.5v1.8h-1.8M9.5 16.5v-1.8h1.8" /></svg>
        </button>
      </header>

      <section class="sheet" id="sheet" aria-label="Clothes">
        <div class="tabs" id="tabs" role="tablist" aria-label="Type of clothing"></div>
        <div class="item-title"><span id="item-name"></span><small id="item-sub"></small></div>
        <div class="cards" id="cards" role="radiogroup" aria-label="Garment"></div>
        <div class="controls" id="controls">
          <label class="slider">
            <span>Size</span>
            <input id="fit-size" type="range" min="80" max="130" step="1" />
          </label>
          <label class="slider">
            <span>Height</span>
            <input id="fit-dy" type="range" min="-30" max="30" step="1" />
          </label>
        </div>
        <div class="actions">
          <button id="btn-compare" class="side-btn" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>
            <span>Hold to compare</span>
          </button>
          <button id="btn-shutter" class="shutter" type="button" aria-label="Take photo"></button>
          <button id="btn-mode" class="side-btn" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
            <span id="mode-label">Photo</span>
          </button>
        </div>
      </section>

      <div id="intro" class="intro">
        <div class="intro-card">
          <svg class="intro-logo" viewBox="0 0 512 512" aria-hidden="true">
            <path d="M256 120c-18 0-30 10-30 24 0 10 6 16 16 22 8 5 14 10 14 18v10L96 330c-14 9-8 30 8 30h304c16 0 22-21 8-30L256 194" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>Try clothes on live</h1>
          <p>Open your camera and see tops, jeans, skirts and dresses on your body in real time. Step back so your whole body is in view, then pick something to wear.</p>
          <button id="btn-start" class="primary" type="button">Start camera</button>
          <button id="btn-intro-photo" class="link" type="button">or try on a photo of you</button>
          <p id="intro-error" class="error" role="alert" hidden></p>
          <p class="privacy">Everything runs on your device. Your video is never uploaded.</p>
        </div>
      </div>

      <div id="result" class="result" hidden>
        <img id="result-img" alt="Your outfit" />
        <div class="result-actions">
          <button id="btn-share" class="primary" type="button">Share / Save</button>
          <button id="btn-close" class="ghost" type="button">Close</button>
        </div>
      </div>

      <input id="file" type="file" accept="image/*" hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
